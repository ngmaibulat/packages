# UNSTABLE, and load-dependent: it passes reliably when the file is run on its
# own (8/8 measured) but fails intermittently inside the full suite, where 200+
# forked child processes are competing for the machine.
#
# The assertion is about an upgrade transaction being finished by the time a
# setTimeout(0) callback runs. Deactivation is a bounded microtask drain (see
# lib/scheduling.ts), which lands before any macrotask -- but a *committed*
# transaction reaches "finished" through a queueTask, and under load that can
# slip past the caller's timer.
#
# Recorded as UNSTABLE so neither outcome turns the build red. Whether the
# expectTimeout fires is part of the same race.
#
# `expectedTests` lists every test in the file, so a run that is killed by the
# timeout still registers the same number of verdicts as a clean one -- the
# Node/Bun parity check compares totals. See run-all.js.
expectTimeout = "UNSTABLE"
expectedTests = [
    "in the complete event handler for a committed transaction",
    "in a setTimeout(0) callback after the complete event is fired for a committed transaction",
]

["in a setTimeout(0) callback after the complete event is fired for a committed transaction"]
expectation = "UNSTABLE"

name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest

        # packages/run drives a real PTY and a chokidar watcher in its tests. A
        # hung pty is a job that would otherwise sit for the full six hours.
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            # Version comes from "packageManager" in the root package.json.
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run typecheck

            - run: pnpm run test
